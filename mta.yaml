_schema-version: '3.1'
ID: com-riotinto-btp-ms-batchmerge
version: 1.0.0
description: OT Batch Merge App — CALM 3-2445

modules:
  - name: com-riotinto-btp-ms-batchmerge-srv
    type: nodejs
    path: .
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm
      build-result: .
      ignore: ['.env', 'node_modules/']
    requires:
      - name: com-riotinto-btp-ms-batchmerge-dest
      - name: com-riotinto-btp-ms-batchmerge-auth
    provides:
      - name: srv-api
        properties:
          srv-url: '${default-url}'

  - name: com-riotinto-btp-ms-batchmerge-ui-deployer
    type: com.sap.application.content
    path: app
    requires:
      - name: com-riotinto-btp-ms-batchmerge-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: com-riotinto-btp-ms-batchmerge-app
          artifacts: ['com-riotinto-btp-ms-batchmerge.zip']
          target-path: resources/

  - name: com-riotinto-btp-ms-batchmerge-app
    type: html5
    path: app/batch-merge
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npx ui5 build --dest dist

resources:
  - name: com-riotinto-btp-ms-batchmerge-dest
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: com-riotinto-btp-ms-batchmerge-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      config:
        xsappname: com-riotinto-btp-ms-batchmerge
        tenant-mode: dedicated

  - name: com-riotinto-btp-ms-batchmerge-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
